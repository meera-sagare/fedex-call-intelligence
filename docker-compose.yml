services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: abc
      POSTGRES_PASSWORD: abc
      POSTGRES_DB: call_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abc -d call_intelligence"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://abc:abc@db:5432/call_intelligence
      CORS_ORIGINS: http://localhost:4200,http://localhost:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_ENGINE: ${AI_ENGINE:-auto}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - whisper-models:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  whisper-models:
